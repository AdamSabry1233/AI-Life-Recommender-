[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    unit: fast, isolated tests with no external dependencies
    integration: multi-module tests, may use mocked LLMs and LangGraph
    slow: long-running (training, full pipeline); excluded from the `fast` subset
    agents: covers anything under src/agents/
    engine: covers ChatEngine / classification routing
    recommender: covers MF inference
    memory: covers FAISS history store / embedder
    baselines: covers Cornac / LightFM / other library baselines
